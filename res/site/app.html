<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Zormid</title>

        <meta charset="UTF-8">

        <link rel="icon" href="/res/images/favicon.png">

        <link rel="preload" href="/res/images/favicon.png">

        <link rel="stylesheet" href="/res/style/theme.css">
        <link rel="stylesheet" href="/res/style/app.css">

        <script>
            document.documentElement.setAttribute("data-theme", "sync");
        </script>
    </head>
    <body>
        <div id="app-container" style="display: none;">
            <div id="side-panel">
                <button id="open-friends-list" class="channel">Friends</button>

                <div id="channel-list-break"></div>

                <div id="channel-list">

                </div>

                <template id="add-channel-template">
                    <button id="add-channel" class="channel">Add Channel</button>
                </template>

                <template id="channel-template">
                    <button class="channel">

                    </button>
                </template>
            </div>

            <div id="main-area">
                <div id="channel-info-container">
                    <p id="channel-name">Friends</p>
                </div>

                <div id="friend-list-container">
                    <div id="friend-container">

                    </div>

                    <template id="add-friend-template">
                        <button id="add-friend" class="friend">Add Friend</button>
                    </template>

                    <template id="friend-template">
                        <button class="friend">

                        </button>
                    </template>
                </div>

                <div id="channel-container" style="display: none;">
                    <div id="message-container">

                    </div>

                    <template id="message-template">
                        <div class="message">
                            <p class="message-username"></p>
                            <p class="message-content"></p>
                        </div>
                    </template>

                    <div id="input-container">
                        <textarea id="message-input" placeholder="Type message here"></textarea>
                        <button id="send-button">➤</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading-screen">
            <img id="loading-logo" src="/res/images/favicon.png" alt="Logo">

            <p id="loading-text">Loading Zormid...</p>
        </div>

        <dialog id="add-friend-menu" class="popup-menu">
            <h3>Add Friend</h3>

            <p class="copyable-url-label">Friend invite link</p>
            <p id="add-friend-url" class="copyable-url"></p>

            <button id="add-friend-close" class="close-button">X</button>
        </dialog>

        <dialog id="accept-friend-menu" class="popup-menu">
            <h3>Accept Friend</h3>

            <p id="accept-friend-text"></p>

            <div id="accept-friend-buttons">
                <button id="accept-friend-accept" class="accept-friend-button">Accept</button>
                <button id="accept-friend-decline" class="accept-friend-button">Decline</button>
            </div>

            <button id="accept-friend-close" class="close-button">X</button>
        </dialog>

        <dialog id="add-channel-menu" class="popup-menu">
            <h3>Add Channel</h3>

            <input id="add-channel-name" placeholder="Channel name">

            <p>Friends:</p>
            <div id="add-channel-friends"></div>

            <button id="add-channel-add" class="add-channel-button">Add</button>
            <button id="add-channel-close" class="close-button">X</button>
        </dialog>

        <template id="add-channel-friend-template">
            <div class="add-channel-friend">
                <p class="add-channel-friend-name"></p>
                <button class="add-channel-friend-button">Add</button>
            </div>
        </template>

        <script type="module" src="/res/scripts/app.js"></script>
    </body>
</html>
