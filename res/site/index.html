<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Zormid</title>

        <meta charset="UTF-8">
    </head>
    <body style="background-color: #101015;">
        <h1 style="color: white;">Welcome to Zormid!</h1>

        <script>
            let socket = new WebSocket("ws://localhost:8082");
            socket.addEventListener("open", () => {
                socket.send("Hello World!");
                console.log("Message sent");
            });
        </script>
    </body>
</html>
